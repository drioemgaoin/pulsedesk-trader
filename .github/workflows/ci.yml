name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.17.1"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm lint

  # ── Dependency audit ────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (required before tests)
        run: pnpm --filter @pulsedesk/contracts build

      - name: Test all packages
        run: pnpm test:unit

  # ── Build ───────────────────────────────────────────────────────────────────
  # Builds all workspace packages including all five MFE apps.
  # Remotes are built before the shell so that the shell's federation config
  # (which references remoteEntry.js paths) is validated against real outputs.
  #
  # Build order:
  #   1. @pulsedesk/contracts  — shared types (required by all apps and services)
  #   2. All four MFE remotes  — independent of each other; pnpm runs in parallel
  #   3. apps/trader-ui shell  — depends on remote URLs (env vars) baked at build time
  #   4. All backend services  — independent of UI; pnpm runs in parallel
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (shared types — required by all apps)
        run: pnpm --filter @pulsedesk/contracts build

      - name: Build MFE remotes (parallel)
        run: |
          set -e
          pids=()
          pnpm --filter @pulsedesk/trading-mfe build & pids+=($!)
          pnpm --filter @pulsedesk/portfolio-mfe build & pids+=($!)
          pnpm --filter @pulsedesk/orders-mfe build & pids+=($!)
          pnpm --filter @pulsedesk/simulator-mfe build & pids+=($!)
          for pid in "${pids[@]}"; do wait "$pid" || exit 1; done
        env:
          # CI build uses localhost defaults; Docker Compose overrides for the actual stack
          VITE_API_BASE_URL: http://localhost:3000
          VITE_STREAM_URL: ws://localhost:3016/stream

      - name: Verify remote federation entries exist
        run: |
          for app in trading-mfe portfolio-mfe orders-mfe simulator-mfe; do
            entry="apps/$app/dist/assets/remoteEntry.js"
            if [ ! -f "$entry" ]; then
              echo "ERROR: $entry not found — federation build failed for $app"
              exit 1
            fi
            echo "OK: $entry"
          done

      - name: Build shell (after remotes)
        run: pnpm --filter @pulsedesk/trader-ui build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_STREAM_URL: ws://localhost:3016/stream
          VITE_TRADING_REMOTE_URL: http://localhost:5173/trading
          VITE_PORTFOLIO_REMOTE_URL: http://localhost:5173/portfolio
          VITE_ORDERS_REMOTE_URL: http://localhost:5173/orders
          VITE_SIMULATOR_REMOTE_URL: http://localhost:5173/simulator
          VITE_GRAFANA_URL: http://localhost:3001
          VITE_RATE_LIMIT_PER_MIN: "100"

      - name: Build backend services
        # --workspace-concurrency=1 is required: multiple services use Prisma and share the
        # same @prisma/client output path. Parallel prisma generate calls overwrite each
        # other's generated types, causing TS2339 errors on sibling service builds.
        # The root `build` script already enforces this for the same reason.
        run: pnpm --filter "!@pulsedesk/trader-ui" --filter "!@pulsedesk/trading-mfe" --filter "!@pulsedesk/portfolio-mfe" --filter "!@pulsedesk/orders-mfe" --filter "!@pulsedesk/simulator-mfe" --filter "!@pulsedesk/contracts" --workspace-concurrency=1 build

  # ── Compose smoke ───────────────────────────────────────────────────────────
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for api-gateway to be healthy
        run: |
          echo "Waiting for api-gateway to become healthy (max 300s)..."
          timeout 300 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 10; echo "  still waiting..."; done'
          echo "Gateway healthy."

      - name: Wait for trader-nginx to be healthy
        run: |
          echo "Waiting for trader-nginx to become healthy (max 120s)..."
          timeout 120 bash -c 'until curl -sf http://localhost:5173/nginx-health > /dev/null; do sleep 5; echo "  still waiting..."; done'
          echo "NGINX healthy."

      - name: Verify gateway health endpoints
        run: |
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          curl -sf http://localhost:3000/ready | grep -q '"status":"ready"'
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/metrics | grep -q "200"
          echo "Gateway endpoints OK."

      - name: Verify shell is served
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:5173/)
          [ "$STATUS" = "200" ] || { echo "ERROR: shell returned HTTP $STATUS"; exit 1; }
          echo "Shell OK (HTTP $STATUS)."

      - name: Verify MFE remote federation entries are served
        run: |
          for remote in trading portfolio orders simulator; do
            URL="http://localhost:5173/${remote}/assets/remoteEntry.js"
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" != "200" ]; then
              echo "ERROR: $URL returned HTTP $STATUS"
              exit 1
            fi
            echo "OK: $URL (HTTP $STATUS)"
          done
          echo "All remoteEntry.js files served."

      - name: Tear down stack
        if: always()
        run: docker compose down

  # ── Performance regression gate ─────────────────────────────────────────────
  # Runs a lightweight k6 smoke suite against the full stack.
  # Fails CI if p95 latency > 250 ms or error rate > 1% (see load-tests/smoke.js).
  # Results are uploaded as artifacts for trend comparison across runs.
  # Reference baseline: load-tests/perf-baseline.json (M7-T1, 2026-03-12).
  perf-smoke:
    name: Performance regression gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for gateway to be healthy
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 10; done'
          echo "Gateway healthy."

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run performance smoke
        run: |
          mkdir -p load-tests/results
          k6 run \
            --out json=load-tests/results/smoke.json \
            --summary-export=load-tests/results/smoke-summary.json \
            load-tests/smoke.js
        env:
          BASE_URL: http://localhost:3000

      - name: Print baseline comparison
        if: always()
        run: |
          echo "=== Performance Smoke Results ==="
          if [ -f load-tests/results/smoke-summary.json ]; then
            node -e "
              const summary = require('./load-tests/results/smoke-summary.json');
              const baseline = require('./load-tests/perf-baseline.json');
              const p95 = summary.metrics?.['http_req_duration{scenario:smoke}']?.['p(95)'];
              const failRate = summary.metrics?.['http_req_failed{expected_response:true}']?.value;
              const warnMs = baseline.thresholds.smoke_p95_warn_ms;
              const failMs = baseline.thresholds.smoke_p95_fail_ms;
              console.log('p95 latency : ' + (p95 ? p95.toFixed(1) + ' ms' : 'n/a'));
              console.log('Error rate  : ' + (failRate != null ? (failRate * 100).toFixed(2) + '%' : 'n/a'));
              console.log('Warn threshold : ' + warnMs + ' ms');
              console.log('Fail threshold : ' + failMs + ' ms');
              if (p95 && p95 > warnMs) {
                console.log('WARNING: p95 (' + p95.toFixed(1) + ' ms) exceeds warn threshold (' + warnMs + ' ms) — investigate before merge.');
              } else {
                console.log('OK: p95 within warn threshold.');
              }
            "
          fi
          echo "Baseline reference: load-tests/perf-baseline.json"
          echo "Run: ${{ github.run_number }} | Commit: ${{ github.sha }}"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-run-${{ github.run_number }}
          path: |
            load-tests/results/smoke-summary.json
            load-tests/results/smoke.json
            load-tests/perf-baseline.json
          retention-days: 90

      - name: Tear down stack
        if: always()
        run: docker compose down
