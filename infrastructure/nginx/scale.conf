# nginx/scale.conf — Load balancer overlay for horizontal scaling drills (M7-T3)
#
# Exposes:
#   :3000  → api-gateway replicas (round-robin, HTTP/1.1 keepalive)
#   :3016  → notification-service replicas (ip_hash sticky, WebSocket upgrade)
#
# Used by docker-compose.scale.yml only.

events {
    worker_connections 1024;
}

http {
    # ── api-gateway upstream (stateless HTTP — round-robin) ────────────────────
    upstream api_gateway {
        server api-gateway:3000;
        keepalive 32;
    }

    # ── notification-service upstream (WebSocket — sticky by client IP) ────────
    upstream notification {
        ip_hash;           # same client IP always routed to same replica
        server notification-service:3016;
    }

    # ── API gateway proxy ──────────────────────────────────────────────────────
    server {
        listen 3000;

        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }

    # ── WebSocket notification proxy ───────────────────────────────────────────
    server {
        listen 3016;

        location / {
            proxy_pass              http://notification;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade $http_upgrade;
            proxy_set_header        Connection "upgrade";
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_read_timeout      3600s;  # long-lived WebSocket connections
            proxy_send_timeout      3600s;
        }
    }
}
