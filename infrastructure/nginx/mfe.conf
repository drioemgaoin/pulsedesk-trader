# NGINX configuration — MFE static serving
# Serves all five Module Federation apps from a single container on port 80.
#
# Layout on disk (/usr/share/nginx/html/):
#   shell/       ← apps/trader-ui dist (shell host — index.html + assets)
#   trading/     ← apps/trading-mfe dist (remote — assets only, no index.html)
#   portfolio/   ← apps/portfolio-mfe dist (remote)
#   orders/      ← apps/orders-mfe dist (remote)
#   simulator/   ← apps/simulator-mfe dist (remote)
#
# URL layout (all on port 5173 externally via docker-compose port mapping):
#   /                                  → shell index.html (SPA — try_files fallback)
#   /trading/assets/remoteEntry.js     → trading-mfe federation entry
#   /portfolio/assets/remoteEntry.js   → portfolio-mfe federation entry
#   /orders/assets/remoteEntry.js      → orders-mfe federation entry
#   /simulator/assets/remoteEntry.js   → simulator-mfe federation entry

server {
    listen 80;
    server_name _;

    # Compression for JS/CSS assets
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json;
    gzip_min_length 1024;

    # ── Shell (SPA host) ────────────────────────────────────────────────────
    # Handles all routes — React Router v7 handles client-side routing.
    location / {
        root /usr/share/nginx/html/shell;

        # SPA fallback: unknown paths serve index.html so React Router takes over
        try_files $uri $uri/ /index.html;

        # index.html: no caching — must always be fresh so new deployments take effect
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }

        # Hashed assets (JS, CSS, fonts, images): immutable long-term caching
        location ~* \.(js|css|woff2|woff|ttf|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Trading MFE remote ──────────────────────────────────────────────────
    location /trading/ {
        alias /usr/share/nginx/html/trading/;

        # Module federation JS bundles: correct MIME type + CORS (same-origin in prod,
        # but explicit header allows the shell to load them regardless of any proxy layer)
        location ~* \.js$ {
            add_header Content-Type "text/javascript";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(css|woff2|woff|ttf|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Remote assets are static — no SPA fallback (remotes have no index.html)
        try_files $uri $uri/ =404;
    }

    # ── Portfolio MFE remote ────────────────────────────────────────────────
    location /portfolio/ {
        alias /usr/share/nginx/html/portfolio/;

        location ~* \.js$ {
            add_header Content-Type "text/javascript";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(css|woff2|woff|ttf|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ =404;
    }

    # ── Orders MFE remote ───────────────────────────────────────────────────
    location /orders/ {
        alias /usr/share/nginx/html/orders/;

        location ~* \.js$ {
            add_header Content-Type "text/javascript";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(css|woff2|woff|ttf|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ =404;
    }

    # ── Simulator MFE remote ────────────────────────────────────────────────
    location /simulator/ {
        alias /usr/share/nginx/html/simulator/;

        location ~* \.js$ {
            add_header Content-Type "text/javascript";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(css|woff2|woff|ttf|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ =404;
    }

    # ── Health probe ────────────────────────────────────────────────────────
    # Used by Docker Compose healthcheck to confirm NGINX is serving.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
