# Secret placeholder — populated externally before install.
#
# NEVER store real values in this file or values.yaml.
# For production, use one of:
#   a) kubectl create secret generic pulsedesk-secrets --from-env-file=.env.prod
#   b) External Secrets Operator (ESO) with Vault / AWS Secrets Manager / GCP Secret Manager
#   c) Sealed Secrets (kubeseal) for GitOps workflows
#
# Required keys:
#   JWT_SECRET                — HS256 signing secret for API gateway JWTs (min 32 chars)
#   DEMO_USERNAME             — login username for demo account
#   DEMO_PASSWORD             — login password for demo account
#   INTERNAL_ORDER_API_KEY    — x-api-key for gateway → order-service
#   INTERNAL_RISK_API_KEY     — x-api-key for order-service → risk-service
#   INTERNAL_TICK_API_KEY     — x-api-key for callers → market-data-service tick endpoint
#   POSTGRES_PASSWORD         — PostgreSQL password
#   DATABASE_URL              — full PostgreSQL connection string (per service if schemas differ)
#
# Example — create from .env file:
#   kubectl create secret generic pulsedesk-secrets \
#     --from-env-file=.env.prod \
#     --namespace pulsedesk \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This placeholder ensures helm template renders without errors when secret is pre-created.
# It does NOT overwrite an existing secret — the `lookup` function is not used to keep
# this chart compatible with helm template --dry-run flows.
