{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{ include "pulsedesk.labels" $ | nindent 4 }}
spec:
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  # Rolling update — zero-downtime deploys.
  # maxUnavailable: 0  — never take a pod down before a new one is ready.
  # maxSurge: 1        — spin up one extra pod during the rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        {{ include "pulsedesk.labels" $ | nindent 8 }}
      annotations:
        # Force pod restart on ConfigMap change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      # Allow full graceful shutdown before SIGKILL.
      # Must be > SHUTDOWN_TIMEOUT_MS (25 s) + preStop sleep (5 s) = 35 s minimum.
      terminationGracePeriodSeconds: 35
      containers:
        - name: {{ $name }}
          image: {{ include "pulsedesk.image" (dict "registry" $.Values.global.imageRegistry "image" $svc.image "tag" $.Values.global.imageTag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          # Drain window — give load balancer time to stop routing before the process exits.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # Shared infrastructure config (non-secret)
          envFrom:
            - configMapRef:
                name: {{ include "pulsedesk.fullname" $ }}-infra-config
          env:
            # Service-specific non-secret env vars
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # Service-specific secret env vars
            {{- range $svc.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: pulsedesk-secrets
                  key: {{ . }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $svc.probeInitialDelaySeconds }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ $svc.probeInitialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            # Readiness failing = pod removed from Service endpoints.
            # Combined with preStop sleep this ensures no traffic during drain.
{{- end }}
{{- end }}
